<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Rates Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-zoom/2.0.1/chartjs-plugin-zoom.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;600;700&display=swap');

  :root {
    --bg:        #0f0f13;
    --surface:   #16161d;
    --border:    #2a2a3a;
    --text:      #e8e6f0;
    --muted:     #7a7890;
    --accent:    #f5a623;
    --accent2:   #e05c5c;

    /* Country palette */
    --c-japan:   #e8534a;
    --c-usa:     #4a8fe8;
    --c-germany: #f0c040;
    --c-uk:      #8b5cf6;
    --c-aus:     #34d399;
    --c-canada:  #f97316;
    --c-swiss:   #ec4899;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 28px 40px 0;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
  }
  .logo {
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: .04em;
    color: var(--accent);
  }
  .logo span { color: var(--text); font-weight: 300; }
  #updated {
    font-family: 'DM Mono', monospace;
    font-size: .72rem;
    color: var(--muted);
  }

  /* ── Controls ── */
  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 20px 40px;
    flex-wrap: wrap;
  }
  .seg-group {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .seg-group button {
    padding: 6px 16px;
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: 'Outfit', sans-serif;
    font-size: .82rem;
    cursor: pointer;
    transition: all .15s;
  }
  .seg-group button.active,
  .seg-group button:hover {
    background: var(--border);
    color: var(--text);
  }

  .range-group {
    display: flex;
    gap: 8px;
    margin-left: auto;
  }
  .range-btn {
    padding: 6px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-family: 'Outfit', sans-serif;
    font-size: .8rem;
    cursor: pointer;
    transition: all .15s;
  }
  .range-btn.active, .range-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ── Country Toggles ── */
  .country-toggles {
    display: flex;
    gap: 10px;
    padding: 0 40px 20px;
    flex-wrap: wrap;
  }
  .ctog {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 13px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    cursor: pointer;
    font-size: .8rem;
    transition: all .15s;
    user-select: none;
  }
  .ctog .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
  }
  .ctog.off { opacity: .35; }

  /* ── Chart Area ── */
  .chart-wrap {
    padding: 0 40px 32px;
    position: relative;
  }
  .chart-container {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 24px 16px;
    position: relative;
    height: 520px;
  }
  canvas { width: 100% !important; }

  .chart-hint {
    text-align: right;
    font-size: .72rem;
    color: var(--muted);
    margin-top: 8px;
    font-family: 'DM Mono', monospace;
  }

  /* ── Latest Values Table ── */
  .table-wrap {
    padding: 0 40px 48px;
  }
  .section-title {
    font-size: .7rem;
    letter-spacing: .12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: .85rem;
  }
  th {
    text-align: left;
    font-weight: 400;
    color: var(--muted);
    font-size: .75rem;
    letter-spacing: .06em;
    text-transform: uppercase;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 11px 16px;
    border-bottom: 1px solid var(--border);
    font-family: 'DM Mono', monospace;
    font-size: .83rem;
  }
  td.country-cell {
    font-family: 'Outfit', sans-serif;
    font-size: .88rem;
    font-weight: 400;
  }
  td.flag { font-size: 1.2rem; padding-right: 4px; }
  td.val  { color: var(--accent); }
  td.spread { color: var(--muted); }
  td.up   { color: #34d399; }
  td.dn   { color: var(--accent2); }
  tr:hover td { background: rgba(255,255,255,.02); }

  /* ── Loading ── */
  #loading {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
    z-index: 99;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { color: var(--muted); font-size: .85rem; }

  @media (max-width: 700px) {
    header, .controls, .country-toggles, .chart-wrap, .table-wrap { padding-left: 16px; padding-right: 16px; }
    .chart-container { height: 340px; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>データ読み込み中…</p>
</div>

<header>
  <div class="logo">Global Rates <span>Dashboard</span></div>
  <div id="updated">—</div>
</header>

<div class="controls">
  <div class="seg-group" id="type-toggle">
    <button class="active" data-type="policy">政策金利</button>
    <button data-type="yield">10年国債</button>
    <button data-type="both">両方</button>
  </div>
  <div class="range-group">
    <button class="range-btn" data-years="1">1Y</button>
    <button class="range-btn" data-years="3">3Y</button>
    <button class="range-btn" data-years="5">5Y</button>
    <button class="range-btn active" data-years="10">10Y</button>
    <button class="range-btn" data-years="30">30Y</button>
  </div>
</div>

<div class="country-toggles" id="country-toggles"></div>

<div class="chart-wrap">
  <div class="chart-container">
    <canvas id="mainChart"></canvas>
  </div>
  <div class="chart-hint">ドラッグ: ズーム　　ホイール: スクロール　　ダブルクリック: リセット</div>
</div>

<div class="table-wrap">
  <div class="section-title">最新値</div>
  <table id="latest-table">
    <thead>
      <tr>
        <th></th>
        <th>国</th>
        <th>政策金利</th>
        <th>10年利回り</th>
        <th>スプレッド</th>
        <th>前日比 (政策)</th>
        <th>前日比 (10年)</th>
      </tr>
    </thead>
    <tbody id="latest-body"></tbody>
  </table>
</div>

<script>
const COUNTRIES = {
  Japan:       { label: "日本",   flag: "🇯🇵", color: "var(--c-japan)" },
  USA:         { label: "米国",   flag: "🇺🇸", color: "var(--c-usa)" },
  Germany:     { label: "ドイツ", flag: "🇩🇪", color: "var(--c-germany)" },
  UK:          { label: "英国",   flag: "🇬🇧", color: "var(--c-uk)" },
  Australia:   { label: "豪州",   flag: "🇦🇺", color: "var(--c-aus)" },
  Canada:      { label: "カナダ", flag: "🇨🇦", color: "var(--c-canada)" },
  Switzerland: { label: "スイス", flag: "🇨🇭", color: "var(--c-swiss)" },
};

// CSS var → hex (for Chart.js)
const COLORS = {
  Japan:       "#e8534a",
  USA:         "#4a8fe8",
  Germany:     "#f0c040",
  UK:          "#8b5cf6",
  Australia:   "#34d399",
  Canada:      "#f97316",
  Switzerland: "#ec4899",
};

let policyData = {}, yieldData = {};
let allDates = [];
let activeCountries = new Set(Object.keys(COUNTRIES));
let activeType = "policy";
let activeYears = 10;
let chart = null;

// ── CSV fetch & parse ──────────────────────────────────────
async function loadCSV(path) {
  const res = await fetch(path);
  const text = await res.text();
  return new Promise(resolve => {
    Papa.parse(text, {
      header: true,
      dynamicTyping: true,
      skipEmptyLines: true,
      complete: r => resolve(r.data)
    });
  });
}

function csvToMap(rows) {
  const map = {};
  const countries = Object.keys(rows[0]).filter(k => k !== "date");
  countries.forEach(c => map[c] = []);
  rows.forEach(row => {
    countries.forEach(c => {
      map[c].push({ date: row.date, value: row[c] });
    });
  });
  return { map, dates: rows.map(r => r.date) };
}

// ── Build chart datasets ───────────────────────────────────
function buildDatasets() {
  const cutoff = new Date();
  cutoff.setFullYear(cutoff.getFullYear() - activeYears);
  const cutStr = cutoff.toISOString().slice(0, 10);

  // dates from policy (or yield if both)
  const srcDates = activeType === "yield"
    ? Object.values(yieldData)[0]?.map(d => d.date) || allDates
    : Object.values(policyData)[0]?.map(d => d.date) || allDates;

  const filteredDates = srcDates.filter(d => d >= cutStr);

  const datasets = [];
  activeCountries.forEach(country => {
    const meta = COUNTRIES[country];
    const color = COLORS[country];

    const makeDataset = (dataMap, label, dash = []) => {
      const series = dataMap[country] || [];
      const values = series
        .filter(d => d.date >= cutStr)
        .map(d => d.value == null || d.value === "" ? null : +d.value);
      return {
        label: `${meta.flag} ${meta.label} ${label}`,
        data: values,
        borderColor: color,
        backgroundColor: color + "18",
        borderWidth: activeType === "both" ? 1.5 : 2,
        borderDash: dash,
        pointRadius: 0,
        tension: 0.3,
        spanGaps: true,
      };
    };

    if (activeType === "policy" || activeType === "both") {
      datasets.push(makeDataset(policyData, "政策金利"));
    }
    if (activeType === "yield" || activeType === "both") {
      datasets.push(makeDataset(yieldData, "10年", [4, 3]));
    }
  });

  return { labels: filteredDates, datasets };
}

// ── Render chart ───────────────────────────────────────────
function renderChart() {
  const { labels, datasets } = buildDatasets();

  if (chart) {
    chart.data.labels = labels;
    chart.data.datasets = datasets;
    chart.update("active");
    return;
  }

  const ctx = document.getElementById("mainChart").getContext("2d");
  chart = new Chart(ctx, {
    type: "line",
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: {
          position: "bottom",
          labels: {
            color: "#7a7890",
            font: { family: "'DM Mono', monospace", size: 11 },
            boxWidth: 20, padding: 14,
          }
        },
        tooltip: {
          backgroundColor: "#16161d",
          borderColor: "#2a2a3a",
          borderWidth: 1,
          titleColor: "#e8e6f0",
          bodyColor: "#a0a0b8",
          titleFont: { family: "'Outfit', sans-serif" },
          bodyFont: { family: "'DM Mono', monospace", size: 12 },
          callbacks: {
            label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y != null ? ctx.parsed.y.toFixed(2) + "%" : "—"}`
          }
        },
        zoom: {
          pan: { enabled: true, mode: "x" },
          zoom: {
            wheel: { enabled: true },
            drag: { enabled: true, backgroundColor: "rgba(245,166,35,.12)" },
            mode: "x",
          },
          limits: { x: { minRange: 30 } }
        }
      },
      scales: {
        x: {
          ticks: {
            color: "#7a7890",
            font: { family: "'DM Mono', monospace", size: 10 },
            maxTicksLimit: 10,
            maxRotation: 0,
          },
          grid: { color: "#2a2a3a" }
        },
        y: {
          ticks: {
            color: "#7a7890",
            font: { family: "'DM Mono', monospace", size: 11 },
            callback: v => v.toFixed(1) + "%"
          },
          grid: { color: "#2a2a3a" }
        }
      }
    }
  });

  // double-click reset zoom
  document.getElementById("mainChart").addEventListener("dblclick", () => chart.resetZoom());
}

// ── Latest values table ────────────────────────────────────
function renderTable() {
  const tbody = document.getElementById("latest-body");
  tbody.innerHTML = "";

  Object.keys(COUNTRIES).forEach(country => {
    const meta = COUNTRIES[country];

    const latest  = (map, key) => {
      const arr = map[key] || [];
      const rev = [...arr].reverse();
      const hit = rev.find(d => d.value != null && d.value !== "");
      return hit ? +hit.value : null;
    };
    const prev = (map, key) => {
      const arr = map[key] || [];
      const rev = [...arr].reverse();
      let found = 0;
      for (const d of rev) {
        if (d.value != null && d.value !== "") {
          found++;
          if (found === 2) return +d.value;
        }
      }
      return null;
    };

    const pol  = latest(policyData, country);
    const yld  = latest(yieldData, country);
    const polP = prev(policyData, country);
    const yldP = prev(yieldData, country);
    const spread = (pol != null && yld != null) ? (yld - pol).toFixed(2) : "—";

    const diffClass = (v, p) => v == null || p == null ? "" : v > p ? "up" : v < p ? "dn" : "";
    const diffStr   = (v, p) => {
      if (v == null || p == null) return "—";
      const d = (v - p).toFixed(2);
      return (v > p ? "+" : "") + d;
    };

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="flag">${meta.flag}</td>
      <td class="country-cell">${meta.label}</td>
      <td class="val">${pol != null ? pol.toFixed(2) + "%" : "—"}</td>
      <td class="val">${yld != null ? yld.toFixed(2) + "%" : "—"}</td>
      <td class="spread">${spread !== "—" ? spread + "%" : "—"}</td>
      <td class="${diffClass(pol, polP)}">${diffStr(pol, polP)}</td>
      <td class="${diffClass(yld, yldP)}">${diffStr(yld, yldP)}</td>
    `;
    tbody.appendChild(tr);
  });
}

// ── Country toggles ────────────────────────────────────────
function buildToggles() {
  const wrap = document.getElementById("country-toggles");
  Object.keys(COUNTRIES).forEach(key => {
    const meta = COUNTRIES[key];
    const el = document.createElement("div");
    el.className = "ctog";
    el.dataset.country = key;
    el.innerHTML = `<span class="dot" style="background:${COLORS[key]}"></span>${meta.flag} ${meta.label}`;
    el.addEventListener("click", () => {
      if (activeCountries.has(key)) {
        activeCountries.delete(key);
        el.classList.add("off");
      } else {
        activeCountries.add(key);
        el.classList.remove("off");
      }
      renderChart();
    });
    wrap.appendChild(el);
  });
}

// ── Event listeners ────────────────────────────────────────
document.getElementById("type-toggle").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  document.querySelectorAll("#type-toggle button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  activeType = btn.dataset.type;
  renderChart();
});

document.querySelectorAll(".range-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".range-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeYears = +btn.dataset.years;
    if (chart) chart.resetZoom();
    renderChart();
  });
});

// ── Init ───────────────────────────────────────────────────
async function init() {
  try {
    const [polRows, yldRows, meta] = await Promise.all([
      loadCSV("data/policy_rates.csv"),
      loadCSV("data/yield_10y.csv"),
      fetch("data/meta.json").then(r => r.json()).catch(() => null),
    ]);

    const polParsed = csvToMap(polRows);
    const yldParsed = csvToMap(yldRows);

    policyData = polParsed.map;
    yieldData  = yldParsed.map;
    allDates   = polParsed.dates;

    if (meta?.updated_at) {
      const d = new Date(meta.updated_at);
      document.getElementById("updated").textContent =
        "Updated: " + d.toLocaleDateString("ja-JP") + " " + d.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" }) + " UTC";
    }

    buildToggles();
    renderChart();
    renderTable();

    document.getElementById("loading").style.display = "none";
  } catch (err) {
    console.error(err);
    document.getElementById("loading").innerHTML =
      `<p style="color:var(--accent2)">データ読み込みエラー: ${err.message}</p>`;
  }
}

init();
</script>
</body>
</html>
