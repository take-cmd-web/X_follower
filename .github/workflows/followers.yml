name: Track followers

on:
  schedule:
    # ── フォロワー記録のみ JST 4〜22時の2時間おき（1日10回）──
    # ツイート収集は GAS（x_posts.csv）に分離したため Actions はフォロワーのみ
    - cron: "0 19 * * *"   # UTC 19:00 = JST 04:00
    - cron: "0 21 * * *"   # UTC 21:00 = JST 06:00
    - cron: "0 23 * * *"   # UTC 23:00 = JST 08:00
    - cron: "0 1 * * *"    # UTC 01:00 = JST 10:00
    - cron: "0 3 * * *"    # UTC 03:00 = JST 12:00
    - cron: "0 5 * * *"    # UTC 05:00 = JST 14:00
    - cron: "0 7 * * *"    # UTC 07:00 = JST 16:00
    - cron: "0 9 * * *"    # UTC 09:00 = JST 18:00
    - cron: "0 11 * * *"   # UTC 11:00 = JST 20:00
    - cron: "0 13 * * *"   # UTC 13:00 = JST 22:00
  workflow_dispatch:        # 手動実行も可能

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install tweepy

      - name: Collect followers
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python scripts/collect_followers_only.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: followers $(TZ=Asia/Tokyo date +'%F %H:%M')"
          git push
